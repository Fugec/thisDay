name: YouTube Auto-Upload

on:
  # Runs Mon/Tue/Thu/Fri at 13:00 UTC — a US morning slot
  # (about 09:00 Eastern during daylight saving time).
  # Runs after blog post generation at 00:05 UTC and failsafe check at 00:35 UTC.
  # Uses fallback ELEVENLABS_API_KEY_2/3 if primary hits quota.
  schedule:
    - cron: "0 13 * * 1,2,4,5"

  # Manual reuploads are always private first. A separate reviewed-promotion
  # mode rechecks the stored narration audit before changing YouTube privacy.
  workflow_dispatch:
    inputs:
      mode:
        description: "Upload privately for review, or promote an audited review upload"
        required: true
        type: choice
        default: upload-private
        options:
          - upload-private
          - promote-reviewed
          - retire-replaced
      slug:
        description: "Blog slug, for example 3-august-2026"
        required: true
        type: string
      confirm_topic_review:
        description: "Required only for promote-reviewed: confirm the narration facts were inspected"
        required: false
        type: boolean
        default: false
      retire_video_id:
        description: "For retire-replaced only: an older same-article YouTube ID to make private"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-upload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Use Ubuntu's signed packages instead of a third-party action that must
      # discover and download the latest johnvansickle release through GitHub.
      # Retry only the package operation, then verify both binaries before any
      # AI, rendering, or upload work can begin.
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "FFmpeg installation failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install npm dependencies
        run: npm ci

      - name: Run narration topic-safety tests
        run: |
          node --check index.js
          node --check promote-reviewed.js
          node test-video-text.js

      - name: Upload new posts to YouTube
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'upload-private'
        run: node index.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          # Every public upload is staged privately in code. Force manual
          # reuploads private even if the scheduled channel uses another mode.
          YOUTUBE_PRIVACY: ${{ github.event_name == 'workflow_dispatch' && 'private' || secrets.YOUTUBE_PRIVACY }}
          HOLD_FOR_TOPIC_REVIEW: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REPLACE_UPLOAD_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'upload-private' && 'true' || 'false' }}
          ALLOW_SILENT_VIDEO: ${{ secrets.ALLOW_SILENT_VIDEO }}
          REUPLOAD_SLUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || secrets.REUPLOAD_SLUGS }}
          MAX_UPLOADS_PER_RUN: ${{ secrets.MAX_UPLOADS_PER_RUN }}
          BLOG_WORKER_URL: ${{ secrets.BLOG_WORKER_URL }}
          YOUTUBE_REGEN_SECRET: ${{ secrets.YOUTUBE_REGEN_SECRET }}
          USE_AI_IMAGE: ${{ secrets.USE_AI_IMAGE }}
          WIKI_IMAGE_MIN_COUNT: ${{ secrets.WIKI_IMAGE_MIN_COUNT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
          HF_TOKEN_4: ${{ secrets.HF_TOKEN_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          # Vision fallback after Groq's llama-4-scout retires 2026-07-17
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          META_SKIP_FACEBOOK: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          TIKTOK_SKIP: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}

      - name: Promote or reconcile reviewed video
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'promote-reviewed' || inputs.mode == 'retire-replaced')
        run: node promote-reviewed.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PROMOTE_SLUG: ${{ inputs.slug }}
          PROMOTE_CONFIRM_TOPIC_REVIEW: ${{ inputs.confirm_topic_review }}
          PROMOTE_RETIRE_ONLY: ${{ inputs.mode == 'retire-replaced' && 'true' || 'false' }}
          PROMOTE_RETIRE_VIDEO_ID: ${{ inputs.retire_video_id }}
